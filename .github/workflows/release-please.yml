name: Release

# On every push to main, release-please keeps a release PR up to date: the next
# version (from Conventional Commit prefixes) in package.json, tauri.conf.json and
# Cargo.toml, the lockfiles synced to it, and the CHANGELOG entry. Merging that PR
# tags the release, publishes a GitHub release and opens a PR that merges main
# back into staging. See docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN do not
          # trigger workflows, so CI would never run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please edits the version files but not the lockfiles, which also
      # record the app's own version.
      - name: Check out the release PR
        if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-node@v7
        if: steps.release.outputs.pr
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.pr
      - name: Sync lockfiles with the new version
        if: steps.release.outputs.pr
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo update --workspace --manifest-path src-tauri/Cargo.toml
          if git diff --quiet; then
            echo "Lockfiles already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync lockfiles with the release version"
          git push

      # The release commit lands on main only; bring it back so staging shows the
      # released version and the next release PR starts from it.
      - name: Open a PR to merge the release back into staging
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh pr create --repo "${{ github.repository }}" --base staging --head main \
            --title "chore: merge release ${{ steps.release.outputs.tag_name }} back into staging" \
            --body "Brings the version bump and CHANGELOG of ${{ steps.release.outputs.tag_name }} from main into staging." \
            || echo "A back-merge PR is already open."
