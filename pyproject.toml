# Python dev tooling (tests/ + future python/ sidecar). Install: uv sync

[project]
name = "job-tracker-dev"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "black>=26.5.1",
  "isort>=9.0.1",
  "ruff>=0.16.6",
  "jsonschema>=4.23.0",
]

[tool.black]
target-version = ["py312"]
line-length = 88
include = '\.pyi?$'
# Literal TOML string: backslashes must not be escape sequences (invalid in "...").
extend-exclude = '/(\.eggs|\.git|node_modules|dist|src-tauri/target)/'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["tests", "python"]
skip_gitignore = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["tests", "python"]
extend-exclude = ["node_modules", "src-tauri/target", "dist"]

[tool.ruff.lint]
# Import order: isort (Black profile). Ruff = fast linter (Flake8-class rules + more).
select = [
  "E",
  "W",
  "F",
  "B",
  "UP",
  "SIM",
  "RUF",
  "TID",
]

[tool.ruff.lint.per-file-ignores]
# ADR 0004 network ban applies to the sidecar package only.
"tests/**" = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket".msg = "ADR 0004: mail_scan sidecar must not use the network"
"http".msg = "ADR 0004: mail_scan sidecar must not use the network"
"http.client".msg = "ADR 0004: mail_scan sidecar must not use the network"
"urllib".msg = "ADR 0004: mail_scan sidecar must not use the network"
"urllib.request".msg = "ADR 0004: mail_scan sidecar must not use the network"
"urllib.error".msg = "ADR 0004: mail_scan sidecar must not use the network"
"requests".msg = "ADR 0004: mail_scan sidecar must not use the network"
"httpx".msg = "ADR 0004: mail_scan sidecar must not use the network"
"smtplib".msg = "ADR 0004: mail_scan sidecar must not use the network"
"ftplib".msg = "ADR 0004: mail_scan sidecar must not use the network"
